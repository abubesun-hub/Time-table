<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مولّد رخصة التفعيل (للمسؤول فقط)</title>
  <style>
    body{font-family:Tajawal,Segoe UI,Arial;direction:rtl;margin:24px}
    .row{display:flex;gap:12px;align-items:center}
    .col{flex:1}
    .label{color:#555}
    .input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
    .btn{padding:10px 14px;border-radius:10px;border:0;color:#fff;background:#2563eb;cursor:pointer}
    .mono{font-family:ui-monospace,Consolas,monospace}
  </style>
</head>
<body>
  <h1>مولّد رخصة التفعيل</h1>
  <p>استخدم هذه الصفحة لإنشاء رخصة مرتبطة بمعرّف جهاز محدد. لا تُشارك هذه الصفحة إلا مع مسؤول النظام.</p>
  <div class="row">
    <div class="col">
      <label class="label">معرّف الجهاز (Device ID)</label>
      <input id="devId" class="input mono" placeholder="مثال: DEV-xxxx" />
    </div>
    <div class="col">
      <label class="label">الانتهاء (أيام)</label>
      <input id="days" type="number" class="input" value="365" />
    </div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="col">
      <label class="label">اسم العميل</label>
      <input id="customer" class="input" placeholder="اسم المدرسة/العميل" />
    </div>
    <div class="col">
      <label class="label">ملاحظات</label>
      <input id="notes" class="input" placeholder="اختياري" />
    </div>
  </div>
  <div style="margin-top:12px"><button id="gen" class="btn">إنشاء رخصة</button></div>
  <h3>الناتج</h3>
  <textarea id="out" class="input mono" rows="8" readonly></textarea>
  <div style="margin-top:8px"><button id="copy" class="btn">نسخ الرخصة</button></div>

  <script src="./assets/js/crypto.js"></script>
  <script>
    async function generate() {
      const deviceId = document.getElementById('devId').value.trim();
      const days = parseInt(document.getElementById('days').value, 10) || 365;
      const customer = document.getElementById('customer').value.trim();
      const notes = document.getElementById('notes').value.trim();
      if (!deviceId) return alert('أدخل معرّف الجهاز');
      const lic = {
        deviceId,
        issuedAt: Date.now(),
        expiresAt: Date.now() + days * 24 * 60 * 60 * 1000,
        customer, notes,
      };
      const blob = await CryptoLite.protect(JSON.stringify(lic), deviceId);
      document.getElementById('out').value = blob;
    }
    document.getElementById('gen').addEventListener('click', generate);
    document.getElementById('copy').addEventListener('click', async () => {
      const v = document.getElementById('out').value; if (!v) return;
      await navigator.clipboard.writeText(v); alert('تم النسخ');
    });
  </script>
</body>
</html>
