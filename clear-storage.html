<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسح التخزين المحلي</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .btn-primary {
      background: #3498db;
      color: white;
    }
    .btn-primary:hover {
      background: #2980b9;
    }
    .info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 مسح التخزين المحلي</h1>
    
    <div class="info">
      <h3>ماذا سيتم مسحه؟</h3>
      <ul>
        <li>جميع بيانات التطبيق (المدرسة، المعلمون، الصفوف)</li>
        <li>حسابات المستخدمين</li>
        <li>النسخ الاحتياطية</li>
        <li>الإعدادات</li>
      </ul>
    </div>
    
    <button class="btn btn-danger" onclick="clearStorage()">
      🗑️ مسح جميع البيانات
    </button>
    
    <button class="btn btn-primary" onclick="openApp()">
      🔙 العودة للتطبيق
    </button>
    
    <div id="status" style="margin-top: 20px; font-weight: bold;"></div>
  </div>

  <script>
    function clearStorage() {
      if (confirm('⚠️ تحذير!\n\nسيتم حذف جميع البيانات المحفوظة نهائياً.\nهل أنت متأكد؟')) {
        try {
          // Clear all localStorage
          localStorage.clear();
          // Clear all sessionStorage
          sessionStorage.clear();
          
          document.getElementById('status').innerHTML = 
            '<span style="color: green;">✅ تم مسح جميع البيانات بنجاح!</span>';
          
          setTimeout(() => {
            document.getElementById('status').innerHTML = 
              '<span style="color: blue;">🔄 سيتم إعادة التوجيه للتطبيق...</span>';
            
            setTimeout(() => {
              window.location.href = 'app.html';
            }, 2000);
          }, 1000);
          
        } catch (error) {
          document.getElementById('status').innerHTML = 
            '<span style="color: red;">❌ خطأ في مسح البيانات: ' + error.message + '</span>';
        }
      }
    }
    
    function openApp() {
      window.location.href = 'app.html';
    }
    
    // Show current storage size
    window.onload = function() {
      try {
        const storageSize = JSON.stringify(localStorage).length;
        document.getElementById('status').innerHTML = 
          '<span style="color: #666;">📊 حجم البيانات المحفوظة: ' + 
          (storageSize / 1024).toFixed(2) + ' كيلوبايت</span>';
      } catch (e) {
        document.getElementById('status').innerHTML = 
          '<span style="color: #666;">📊 لا يمكن حساب حجم البيانات</span>';
      }
    };
  </script>
</body>
</html>
